# ============================================================
#  Doce Gestão v5 — Docker Compose
#
#  Uso:
#    docker compose up --build        # primeira vez
#    docker compose up -d             # subir em background
#    docker compose down              # parar
#    docker compose down -v           # parar e apagar banco
#
#  Acesse: http://localhost:3000
#  API:    http://localhost:8080/api
# ============================================================

services:

  db:
    image: mysql:8.0
    container_name: docegestao-db
    restart: unless-stopped
    environment:
      # Valores lidos do .env (copie de .env.example); nenhum segredo fica no repositório
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?defina MYSQL_ROOT_PASSWORD no .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-docegestao}
      MYSQL_ROOT_HOST: '%'
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
    ports:
      - "127.0.0.1:3306:3306"   # só a própria máquina (dev local); o backend usa a rede interna
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: docegestao-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?defina SPRING_DATASOURCE_URL no .env}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-root}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?defina SPRING_DATASOURCE_PASSWORD no .env}
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (openssl rand -base64 64)}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      APP_SEED_ENABLED: ${APP_SEED_ENABLED:-true}
      # Fuso da JVM: LocalDate.now() do painel e dos relatórios no horário de Brasília
      JAVA_TOOL_OPTIONS: "-Duser.timezone=America/Sao_Paulo"
      TZ: America/Sao_Paulo
    ports:
      - "8080:8080"
    healthcheck:
      # Rota pública: qualquer resposta HTTP (mesmo 405) prova que a API subiu.
      # Sem -f, curl só falha se a conexão for recusada.
      test: ["CMD-SHELL", "curl -s -o /dev/null http://localhost:8080/api/auth/login || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: docegestao-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  db_data:
