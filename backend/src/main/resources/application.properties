# ========================
# Banco de Dados — MySQL 8
# Em Docker, as variáveis SPRING_DATASOURCE_* sobrescrevem estes valores.
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/docegestao?useSSL=false&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=sua_senha_aqui
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / Hibernate
# ========================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ========================
# Servidor
# ========================
server.port=8080
server.servlet.context-path=/api

# ========================
# Jackson
# ========================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.mapper.default-view-inclusion=false

# ========================
# JWT
# Em Docker, JWT_SECRET e JWT_EXPIRATION_MS sobrescrevem estes valores.
# ========================
jwt.secret=${JWT_SECRET:3d8f2a1c9b0e7f4d6a5c3e1b8d2f0a9c7e5b3d1f9a7c5e3b1d9f7a5c3e1b8d2}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ========================
# Flyway
# ========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
