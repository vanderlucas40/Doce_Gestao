# ========================
# Banco de Dados — MySQL 8
# Em Docker, as variáveis SPRING_DATASOURCE_* sobrescrevem estes valores.
# ========================
spring.datasource.url=jdbc:mysql://localhost:3306/docegestao?useSSL=false&serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=sua_senha_aqui
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ========================
# JPA / Hibernate
# ========================
# Flyway é a única fonte do esquema; o Hibernate só confere se as entidades batem (R07)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=false

# ========================
# Servidor
# ========================
server.port=8080
server.servlet.context-path=/api

# ========================
# Jackson
# ========================
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo
spring.jackson.mapper.default-view-inclusion=false

# ========================
# JWT
# Em Docker, JWT_SECRET e JWT_EXPIRATION_MS sobrescrevem estes valores.
# ========================
# Obrigatório e sem valor padrão (R05): a aplicação não sobe sem JWT_SECRET (mín. 32 bytes)
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ========================
# Flyway
# ========================
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ========================
# Dados de demonstração (DataInitializer)
# Desligado por padrão; o docker-compose liga via APP_SEED_ENABLED=true.
# ========================
app.seed.enabled=${APP_SEED_ENABLED:false}
