# Integração contínua do Doce Gestão: roda a cada push e pull request na main.
# Três jobs independentes: backend (59 testes, MySQL via Testcontainers),
# frontend (17 testes + build) e smoke test do docker compose (RNF07).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Java 21 + Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # O runner tem Docker: os testes de integração sobem MySQL 8 real (Testcontainers)
      - name: Build e testes
        run: mvn -B -ntp verify
      # Testcontainers ignora (skip) os testes de integração quando não acha Docker;
      # no CI isso precisa falhar, senão metade da suíte some sem aviso (DEF-12)
      - name: Garantir que nenhum teste foi ignorado
        run: |
          grep -ho 'skipped="[0-9]*"' target/surefire-reports/TEST-*.xml | sort | uniq -c
          if grep -l 'skipped="[1-9]' target/surefire-reports/TEST-*.xml; then
            echo "::error::Há testes ignorados (Docker/Testcontainers indisponível?)"; exit 1
          fi
      - name: Relatórios de teste
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          retention-days: 14

  frontend:
    name: Frontend (Node 20 + Vitest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Testes
        run: npm test
      - name: Build
        run: npm run build

  compose:
    name: Smoke test (docker compose)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5
      - name: Criar .env de CI a partir do exemplo
        run: |
          cp .env.example .env
          SECRET=$(openssl rand -base64 64 | tr -d '\n')
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=${SECRET}|" .env
      - name: Subir os três contêineres e aguardar healthchecks
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Verificar frontend e API
        run: |
          curl -fsS http://localhost:3000/ | grep -qi '<div id="root"'
          # Login com o usuário de demonstração (seed ligado no .env.example)
          TOKEN=$(curl -fsS -X POST http://localhost:3000/api/auth/login \
                    -H 'Content-Type: application/json' \
                    -d '{"username":"admin","password":"admin123"}' | jq -r .token)
          test -n "$TOKEN" && test "$TOKEN" != "null"
          curl -fsS http://localhost:3000/api/stores -H "Authorization: Bearer $TOKEN" | jq -e 'length >= 1'
          # Sem token: 401 em JSON (DEF-02)
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/stores)" = "401"
      - name: Logs em caso de falha
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Derrubar
        if: always()
        run: docker compose down -v
